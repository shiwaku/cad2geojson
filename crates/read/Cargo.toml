[package]
name = "cad2geojson-read"
description = "Read DWG / DXF into drawing-coordinate GeoJSON (via dwg2geo and acadrust)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# DWG → GeoJSON の変換は dwg2geo に任せる（内部で acadrust 0.5.1 を使う）
dwg2geo = { version = "=0.2.5", default-features = false, features = ["native-backend"] }
# DXF は acadrust 0.6 で読み、DWG（メモリ上）にしてから dwg2geo に渡す。
# 0.5.1 は R12 の DXF を読めない（Phase 0 で確認）
acadrust.workspace = true
thiserror.workspace = true

[dev-dependencies]
encoding_rs = "0.8"
